$kind: http-request
name: "T08: Tambah Produk dengan Stok Sangat Besar"
url: http://127.0.0.1:5000/products
method: POST
body:
  type: json
  content: "{\r

    \  \"nama_barang\": \"Produk Stok Masif\",\r

    \  \"deskripsi\": \"Edge case stok ekstrem\",\r

    \  \"harga\": 5000,\r

    \  \"stok\": 2147483647\r

    }"
auth:
  credentials:
    - key: token
      value: "{{access_token}}"
  type: bearer
scripts:
  - type: afterResponse
    code: "var jsonData = pm.response.json();\r

      \r

      // Assert kode status adalah 201\r

      pm.test(\"Kode status adalah 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      // Assert produk berhasil ditambahkan\r

      pm.test(\"Produk dengan stok maksimum berhasil ditambahkan\", function ()
      {\r

      \    pm.expect(jsonData).to.have.property('added_product');\r

      });\r

      \r

      // Assert nilai stok tersimpan dengan benar\r

      pm.test(\"Nilai stok INT MAX tersimpan dengan benar\", function () {\r

      \    pm.expect(jsonData.added_product.stok).to.eql(2147483647);\r

      });"
    language: text/javascript
order: 4493645658098649
