$kind: http-request
name: "T06: Hapus produk berdasarkan ID"
url: http://127.0.0.1:5000/products/{{id_produk_baru}}
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Kode status adalah 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Data produk berhasil dihapus\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.have.property('success');\r

      \    pm.expect(jsonData.success).to.eql(`Produk ${pm.variables.get(\"id_produk_baru\")} berhasil dihapus`);\r

      });"
    language: text/javascript
order: 3513810750807167
