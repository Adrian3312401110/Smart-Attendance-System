$kind: http-request
name: "T03: Melihat semua produk"
url: http://127.0.0.1:5000/products
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Kode status adalah 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Semua produk berhasil ditampilkan\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    var expectedColumns = [\"harga\", \"id\", \"nama_barang\", \"stok\"];\r

      \    var firstObject = jsonData[0];\r

      \    expectedColumns.forEach(function (column) {\r

      \        pm.expect(firstObject).to.have.property(column);\r

      \    });\r

      });"
    language: text/javascript
order: 2466675040175856
