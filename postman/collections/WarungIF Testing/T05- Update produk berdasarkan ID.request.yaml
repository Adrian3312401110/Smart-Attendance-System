$kind: http-request
name: "T05: Update produk berdasarkan ID"
url: http://127.0.0.1:5000/products/{{id_produk_baru}}
method: PATCH
body:
  type: json
  content: "{\r

    \    \"nama_barang\": \"Susu Ultra Coklat\",\r

    \    \"deskripsi\": \"Susu UHT rasa coklat\",\r

    \    \"harga\": 9000,\r

    \    \"stok\": 60\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Kode status adalah 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Data produk berhasil diperbarui\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.have.property('success');\r

      \    pm.expect(jsonData.success).to.eql(`Produk ${pm.collectionVariables.get(\"id_produk_baru\")} berhasil diubah`);\r

      });"
    language: text/javascript
order: 2902860216511112
