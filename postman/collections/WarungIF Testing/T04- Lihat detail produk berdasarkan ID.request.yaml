$kind: http-request
name: "T04: Lihat detail produk berdasarkan ID"
url: http://127.0.0.1:5000/products/{{id_produk_baru}}
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "pm.test(\"Kode status adalah 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Data spesifik produk berhasil ditampilkan\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    var expectedColumns = [\"deskripsi\", \"harga\", \"id\", \"nama_barang\", \"stok\"];\r

      \    expectedColumns.forEach(function (column) {\r

      \        pm.expect(jsonData).to.have.property(column);\r

      \    });\r

      });"
    language: text/javascript
order: 2898935390113152
